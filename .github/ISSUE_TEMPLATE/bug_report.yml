name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, tokens, recordings, note contents, account
        identifiers, or private host details. Use a private security advisory
        for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider path
      options:
        - Simulator and mock assistant
        - Real Light provider
        - Sign in with ChatGPT assistant
        - Local transcription
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
